server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain always;
        add_header Cache-Control no-store always;
        add_header X-GoToDoList-Frontend-Instance $hostname always;
        add_header X-GoToDoList-Frontend-IP $server_addr always;
        return 200 'ok';
    }

    location / {
        try_files $uri /index.html;
    }
}
