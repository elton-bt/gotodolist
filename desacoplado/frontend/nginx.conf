server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos definidos apenas no nível server (evita header-redefinition em blocos location)
    add_header X-GoToDoList-Frontend-Instance $hostname always;
    add_header X-GoToDoList-Frontend-IP $server_addr always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /health {
        access_log off;
        default_type text/plain;
        expires -1;
        return 200 'ok';
    }

    location / {
        try_files $uri /index.html;
    }
}
