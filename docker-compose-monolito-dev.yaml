name: gotodolist-monolito

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gotodolist}
      POSTGRES_USER: ${DB_USER:-gotodolist}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-replace-me}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  monolito:
    build:
      context: .
      dockerfile: monolito/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-gotodolist}
      DB_USER: ${DB_USER:-gotodolist}
      DB_PASSWORD: ${DB_PASSWORD:-replace-me}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    ports:
      - "${MONOLITO_HOST_PORT:-8080}:8080"
    networks:
      - app_db
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres-data:

networks:
  app_db: