name: Publish Docker Images and Release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  tag-creation:
    name: 0. Create version tag
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.merged == true
    outputs:
      created_tag: ${{ steps.created_tag.outputs.created_tag }}
      change_type: ${{ steps.change_type.outputs.change_type }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect change type from PR labels
        id: change_type
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "change_type=patch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          labels='${{ toJson(github.event.pull_request.labels.*.name) }}'
          if echo "$labels" | grep -qi 'major'; then
            change_type='major'
          elif echo "$labels" | grep -Eqi 'minor|feature|feat'; then
            change_type='minor'
          else
            change_type='patch'
          fi

          echo "change_type=$change_type" >> "$GITHUB_OUTPUT"

      - name: Get latest tag
        id: last_tag
        run: |
          last_tag="$(git tag --sort=-v:refname | head -n 1)"
          if [ -z "$last_tag" ]; then
            last_tag='0.0.0'
          fi

          last_tag="${last_tag#v}"
          echo "last_tag=$last_tag" >> "$GITHUB_OUTPUT"

      - name: Bump version
        id: created_tag
        run: |
          IFS='.' read -r major minor patch <<< "${{ steps.last_tag.outputs.last_tag }}"

          case "${{ steps.change_type.outputs.change_type }}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac

          created_tag="${major}.${minor}.${patch}"
          echo "created_tag=$created_tag" >> "$GITHUB_OUTPUT"

  verify:
    name: 1. Verify source
    runs-on: ubuntu-latest
    needs: tag-creation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download Go modules
        run: go mod download

      - name: Run Go tests
        run: go test ./...

      - name: Validate Compose profiles
        run: |
          docker compose --profile monolito config >/dev/null
          docker compose --profile desacoplado config >/dev/null

  build-and-push:
    name: 2. Build and push Docker images
    runs-on: ubuntu-latest
    needs: [tag-creation, verify]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: monolito
            dockerfile: monolito/Dockerfile
          - image_name: api
            dockerfile: desacoplado/backend/Dockerfile
          - image_name: frontend
            dockerfile: desacoplado/frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image_name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image_name }}:${{ needs.tag-creation.outputs.created_tag }}

  trivy-scan:
    name: 3. Scan published images
    runs-on: ubuntu-latest
    needs: [tag-creation, build-and-push]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image_name: [monolito, api, frontend]

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image_name }}:${{ needs.tag-creation.outputs.created_tag }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  release-creation:
    name: 4. Create GitHub release
    runs-on: ubuntu-latest
    needs: [tag-creation, build-and-push, trivy-scan]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag-creation.outputs.created_tag }}
          name: Release ${{ needs.tag-creation.outputs.created_tag }}
          generate_release_notes: true
          body: |
            Docker images published for this release:

            - `${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-monolito:${{ needs.tag-creation.outputs.created_tag }}`
            - `${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ needs.tag-creation.outputs.created_tag }}`
            - `${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ needs.tag-creation.outputs.created_tag }}`

            Pull examples:

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-monolito:${{ needs.tag-creation.outputs.created_tag }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ needs.tag-creation.outputs.created_tag }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ needs.tag-creation.outputs.created_tag }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
