name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# 🔒 BLINDAGEM 1: Princípio do Menor Privilégio
# Por padrão, todos os jobs têm acesso estritamente somente-leitura ao repositório
permissions:
  contents: read

# Cancela execuções antigas do mesmo PR/branch quando novos commits chegam
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 🔒 BLINDAGEM 2: evita jobs travados consumindo créditos

    steps:
      # 🔒 BLINDAGEM 3: actions oficiais em major estável; terceiros pinados por SHA completo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # 🔒 BLINDAGEM 4: cache nativo de módulos e build cache do Go
          cache: true
          cache-dependency-path: go.sum

      - name: Download Go modules
        run: go mod download

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.12.2

      - name: Run Go tests
        run: go test ./...

  container-validation:
    name: Validate containers
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 20

    strategy:
      fail-fast: true
      matrix:
        include:
          - image_name: monolito
            dockerfile: monolito/Dockerfile
          - image_name: api
            dockerfile: desacoplado/backend/Dockerfile
          - image_name: frontend
            dockerfile: desacoplado/frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Compose files
        if: matrix.image_name == 'monolito'
        run: |
          docker compose --env-file example.env -f docker-compose-dev.yaml config >/dev/null
          docker compose --env-file example.env -f docker-compose-monolito-dev.yaml config >/dev/null
          docker compose --env-file example.env -f docker-compose-monolito-prod.yaml config >/dev/null
          docker compose --env-file example.env -f docker-compose-prod.yaml config >/dev/null

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🔒 BLINDAGEM 5: build sem push, com cache de camadas no GitHub Actions Cache
      - name: Build ${{ matrix.image_name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: gotodolist-${{ matrix.image_name }}:ci
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}
