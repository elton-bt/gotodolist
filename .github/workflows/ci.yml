name: Continuous Integration (CI) - Hardened & Secure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 🔒 BLINDAGEM 1: Princípio do Menor Privilégio
permissions:
  contents: read

# Evita execuções concorrentes desnecessárias: cancela execuções antigas do mesmo PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: 🔍 Qualidade, Linters & Testes Automatizados
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 🔒 BLINDAGEM 2: Prevenção contra jobs travados consumindo créditos

    steps:
      - name: 📥 Checkout Seguro do Código
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Runtime Go com Cache Nativo
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true # 🔒 BLINDAGEM 3: Reutilização inteligente de cache de pacotes/módulos Go

      - name: 📦 Download dos Módulos Go
        run: go mod download

      - name: 🧹 Verificação de Formatação Go (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: 🔍 Análise Estática com golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: 🧪 Execução de Testes Automatizados (Fail Fast)
        run: go test -v ./...

  container-validation:
    name: 🐳 Validação e Build Local de Containers
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Seguro do Código
        uses: actions/checkout@v4

      - name: 🛠️ Validar Arquivos Compose
        run: |
          docker compose --env-file example.env -f docker-compose-dev.yaml config >/dev/null
          docker compose --env-file example.env -f docker-compose-monolito-dev.yaml config >/dev/null
          docker compose --env-file example.env -f docker-compose-monolito-prod.yaml config >/dev/null
          docker compose --env-file example.env -f docker-compose-prod.yaml config >/dev/null

      - name: 🏗️ Build da Imagem do Monólito
        run: docker build -f monolito/Dockerfile -t gotodolist-monolito:ci .

      - name: 🏗️ Build da Imagem da API
        run: docker build -f desacoplado/backend/Dockerfile -t gotodolist-api:ci .

      - name: 🏗️ Build da Imagem do Frontend
        run: docker build -f desacoplado/frontend/Dockerfile -t gotodolist-frontend:ci .
