name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download Go modules
        run: go mod download

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Run Go tests
        run: go test ./...

  container-validation:
    name: Validate containers
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose profiles
        run: |
          docker compose -f docker-compose-dev.yaml config >/dev/null
          docker compose -f docker-compose-monolito.yaml config >/dev/null
          docker compose -f docker-compose-prod.yaml --profile monolito config >/dev/null
          docker compose -f docker-compose-prod.yaml --profile desacoplado config >/dev/null

      - name: Build monolith image
        run: docker build -f monolito/Dockerfile -t gotodolist-monolito:ci .

      - name: Build API image
        run: docker build -f desacoplado/backend/Dockerfile -t gotodolist-api:ci .

      - name: Build frontend image
        run: docker build -f desacoplado/frontend/Dockerfile -t gotodolist-frontend:ci .
