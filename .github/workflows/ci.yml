name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: Run Go tests
        run: go test ./...

  security-scan:
    name: Security scan (SAST Semgrep & Container Trivy)
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build app image for scan
        run: docker build -f monolito/Dockerfile -t gotodolist:scan .

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/security-audit
          auditOn: push

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: gotodolist:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  container-validation:
    name: Validate containers
    runs-on: ubuntu-latest
    needs: [lint-and-test, security-scan]
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose files
        run: |
          docker compose --env-file example.env -f docker-compose-dev.yaml config >/dev/null
          docker compose --env-file example.env -f docker-compose-monolito-dev.yaml config >/dev/null
          docker compose --env-file example.env -f docker-compose-monolito-prod.yaml config >/dev/null
          docker compose --env-file example.env -f docker-compose-prod.yaml config >/dev/null

      - name: Build monolith image
        run: docker build -f monolito/Dockerfile -t gotodolist-monolito:ci .

      - name: Build API image
        run: docker build -f desacoplado/backend/Dockerfile -t gotodolist-api:ci .

      - name: Build frontend image
        run: docker build -f desacoplado/frontend/Dockerfile -t gotodolist-frontend:ci .
