name: 🐛 Relato de Bug
description: Reporte um problema encontrado na aplicação, no ambiente de execução ou na infraestrutura.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por dedicar seu tempo para relatar este problema. Preencha os campos abaixo com o máximo de detalhes possível.

  - type: textarea
    id: what-happened
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento inesperado com clareza.
      placeholder: Ex.: ao acessar a rota /tasks, a API retorna 500 e o container trava.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Liste os passos necessários para reproduzir o problema.
      placeholder: |
        1. Suba o ambiente com docker compose up
        2. Acesse http://localhost:8081/health
        3. Observe o erro
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Ambiente de execução
      description: Onde o problema foi observado?
      options:
        - Linux nativo
        - Windows com WSL2
        - macOS
        - Docker Compose local
        - Produção / ambiente de homologação
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
      description: O que deveria acontecer?
      placeholder: O aplicativo deveria responder 200 OK e listar as tarefas.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs e evidências
      description: Cole a saída relevante dos comandos, logs do container ou respostas HTTP.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Informações adicionais
      description: Inclua detalhes do sistema, versões e contexto útil.
      placeholder: |
        - Go: 1.26.0
        - Docker: 27.x
        - Compose: v2.x
        - Navegador ou cliente HTTP usado
    validations:
      required: false

  - type: checkboxes
    id: validations
    attributes:
      label: Validação prévia
      options:
        - label: Confirmo que não existe outra issue aberta sobre o mesmo problema.
          required: true
        - label: Testei o problema com a última versão disponível da branch principal.
          required: true
